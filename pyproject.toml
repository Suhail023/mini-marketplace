# Root pyproject.toml — shared tooling config consumed by pre-commit hooks.
# Each service has its own pyproject.toml for dependencies/packaging.

[tool.ruff]
target-version = "py311"
line-length = 100
# Directories to ignore
exclude = [
    ".git",
    "__pycache__",
    ".mypy_cache",
    ".ruff_cache",
    "alembic/versions",
    "poetry.lock",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "S",    # flake8-bandit (security)
    "ANN",  # flake8-annotations (type hints)
    "RUF",  # Ruff-specific rules
]
ignore = [
    "ANN101",  # Missing type annotation for `self`
    "ANN102",  # Missing type annotation for `cls`
    "ANN401",  # Dynamically typed expressions (Any) are disallowed
    "S101",    # Use of `assert` detected (fine in tests)
    "B008",    # Do not perform function calls in default arguments (FastAPI uses Depends)
]

[tool.ruff.lint.isort]
known-first-party = ["app", "common"]
force-sort-within-sections = true

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["S", "ANN"]
"alembic/env.py" = ["ANN", "E402"]

[tool.black]
line-length = 100
target-version = ["py311"]
exclude = '''
/(
    \.git
  | __pycache__
  | alembic/versions
  | \.venv
)/
'''

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
ignore_missing_imports = true    # avoids false positives on untyped third-party libs
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true

# Ignore generated migration files
exclude = [
    "alembic/versions/",
]
