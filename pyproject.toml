# Root pyproject.toml — shared tooling config consumed by pre-commit hooks.
# Each service has its own pyproject.toml for dependencies/packaging.

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".git",
    "__pycache__",
    ".mypy_cache",
    ".ruff_cache",
    "alembic/versions",
    "poetry.lock",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "S",    # flake8-bandit (security)
    "ANN",  # flake8-annotations (type hints)
    "RUF",  # Ruff-specific rules
]
ignore = [
    "ANN201",  # Missing return type annotation for public function
    "ANN202",  # Missing return type annotation for private function
    "ANN204",  # Missing return type annotation for special method
    "ANN401",  # Dynamically typed expressions (Any) are disallowed
    "S101",    # Use of `assert` detected (fine in tests)
    "S104",    # Possible binding to all interfaces
    "S105",    # Possible hardcoded password (false positive on token_type = "bearer")
    "B008",    # Do not perform function calls in default arguments (FastAPI uses Depends)
    "B904",    # raise ... from err (can be noisy in service code)
    "RUF009",  # Do not perform function call in dataclass defaults
]

[tool.ruff.lint.isort]
known-first-party = ["app", "common"]
force-sort-within-sections = true

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["S", "ANN"]
"**/alembic/env.py" = ["ANN", "E402"]
"**/services/user-service/**/*.py" = ["E402"]
"**/shared/**/*.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
exclude = [
    "alembic/versions/",
    "services/user-service/",
    "services/product-service/",
    "shared/",
]
