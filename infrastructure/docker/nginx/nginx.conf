upstream user_service {
    server user-service:8001;
}

upstream product_service {
    server product-service:8002;
}

upstream order_service {
    server order-service:8003;
}

upstream payment_service {
    server payment-service:8004;
}

# Generate correlation ID at the gateway if not provided by the client.
# Uses a request_id variable so downstream services can read it.
map $http_x_correlation_id $correlation_id {
    default $http_x_correlation_id;
    ""      $request_id;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    # User & Auth routes
    location /users {
        proxy_pass http://user_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $correlation_id;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    location /auth {
        proxy_pass http://user_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $correlation_id;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # Product routes
    location /products {
        proxy_pass http://product_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $correlation_id;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # Order routes
    location /orders {
        proxy_pass http://order_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $correlation_id;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # Payment routes
    location /payments {
        proxy_pass http://payment_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $correlation_id;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # Health check for the gateway itself
    location /health {
        return 200 '{"status":"ok","service":"api-gateway"}';
        add_header Content-Type application/json;
    }

    # Default — return 404 for unmatched routes
    location / {
        return 404 '{"error":"not_found","message":"Route not found. Available: /users, /auth, /products, /orders, /payments"}';
        add_header Content-Type application/json;
    }
}
