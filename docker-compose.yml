# Secrets are mounted from ./secrets (gitignored) as Docker secrets and read by
# services via *_FILE env vars. Nothing secret lives in this file.
# Create them once with: python scripts/generate_secrets.py
x-jwt-env: &jwt-env
  JWT_SECRET_KEY_FILE: /run/secrets/jwt_secret_key
  JWT_ALGORITHM: HS256

services:
  # Infrastructure Services
  postgres:
    image: postgres:15-alpine
    container_name: mini-marketplace-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_MULTIPLE_DATABASES: userdb,productdb,orderdb,paymentdb,notificationdb
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres-init.sh:/docker-entrypoint-initdb.d/postgres-init.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - marketplace-network

  redis:
    image: redis:7-alpine
    container_name: mini-marketplace-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - marketplace-network

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: mini-marketplace-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - marketplace-network

  # Microservices
  # Service ports are published on loopback only: /internal/* and payment-service
  # must not be reachable from the network, where the gateway can't shield them.
  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    container_name: user-service
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      <<: *jwt-env
      SERVICE_NAME: user-service
      PORT: 8001
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/userdb
      JWT_EXPIRATION_MINUTES: 60
      ADMIN_USER_IDS: ${ADMIN_USER_IDS:-}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOG_LEVEL: INFO
      ENVIRONMENT: development
    secrets:
      - jwt_secret_key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - marketplace-network
    restart: unless-stopped

  product-service:
    build:
      context: .
      dockerfile: services/product-service/Dockerfile
    container_name: product-service
    ports:
      - "127.0.0.1:8002:8002"
    environment:
      <<: *jwt-env
      INTERNAL_SERVICE_TOKEN_FILE: /run/secrets/internal_service_token
      SERVICE_NAME: product-service
      PORT: 8002
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/productdb
      REDIS_HOST: redis
      LOG_LEVEL: INFO
    secrets:
      - jwt_secret_key
      - internal_service_token
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - marketplace-network
    restart: unless-stopped

  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    container_name: order-service
    ports:
      - "127.0.0.1:8003:8003"
    environment:
      <<: *jwt-env
      INTERNAL_SERVICE_TOKEN_FILE: /run/secrets/internal_service_token
      SERVICE_NAME: order-service
      PORT: 8003
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/orderdb
      PRODUCT_SERVICE_URL: http://product-service:8002
      PAYMENT_SERVICE_URL: http://payment-service:8004
      HTTP_TIMEOUT: 10.0
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_VHOST: /
      LOG_LEVEL: INFO
      ENVIRONMENT: development
    secrets:
      - jwt_secret_key
      - internal_service_token
    depends_on:
      postgres:
        condition: service_healthy
      product-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - marketplace-network
    restart: unless-stopped

  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    container_name: payment-service
    ports:
      - "127.0.0.1:8004:8004"
    environment:
      INTERNAL_SERVICE_TOKEN_FILE: /run/secrets/internal_service_token
      SERVICE_NAME: payment-service
      PORT: 8004
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/paymentdb
      LOG_LEVEL: INFO
      ENVIRONMENT: development
    secrets:
      - internal_service_token
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - marketplace-network
    restart: unless-stopped

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: notification-service
    ports:
      - "127.0.0.1:8005:8005"
    environment:
      <<: *jwt-env
      SERVICE_NAME: notification-service
      PORT: 8005
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/notificationdb
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_VHOST: /
      LOG_LEVEL: INFO
      ENVIRONMENT: development
    secrets:
      - jwt_secret_key
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - marketplace-network
    restart: unless-stopped

  # API Gateway
  api-gateway:
    image: nginx:1.25-alpine
    container_name: api-gateway
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - marketplace-network
    restart: unless-stopped

secrets:
  jwt_secret_key:
    file: ./secrets/jwt_secret_key
  internal_service_token:
    file: ./secrets/internal_service_token

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

networks:
  marketplace-network:
    driver: bridge
