services:
  # Infrastructure Services
  postgres:
    image: postgres:15-alpine
    container_name: mini-marketplace-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_MULTIPLE_DATABASES: userdb,productdb,orderdb,paymentdb
    ports:
      - "5433:5432"  # Using 5433 to avoid conflict with local PostgreSQL
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres-init.sh:/docker-entrypoint-initdb.d/postgres-init.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - marketplace-network

  redis:
    image: redis:7-alpine
    container_name: mini-marketplace-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - marketplace-network

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: mini-marketplace-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"  # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - marketplace-network

  # Microservices
  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    container_name: user-service
    ports:
      - "8001:8001"
    environment:
      - SERVICE_NAME=user-service
      - PORT=8001
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/userdb
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LOG_LEVEL=INFO
      - ENVIRONMENT=development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - marketplace-network
    restart: unless-stopped

  product-service:
    build:
      context: .
      dockerfile: services/product-service/Dockerfile
    container_name: product-service
    ports:
      - "8002:8002"
    environment:
      - SERVICE_NAME=product-service
      - PORT=8002
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/productdb
      - REDIS_HOST=redis
      - LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - marketplace-network
    restart: unless-stopped

  # order-service:   # TODO: not yet created
  #   build:
  #     context: ./services/order-service
  #     dockerfile: Dockerfile
  #   ...

  # payment-service:  # TODO: not yet created
  #   build:
  #     context: ./services/payment-service
  #     dockerfile: Dockerfile
  #   ...

  # notification-service:  # TODO: not yet created
  #   build:
  #     context: ./services/notification-service
  #     dockerfile: Dockerfile
  #   ...

  # api-gateway:  # TODO: not yet created
  #   build:
  #     context: ./services/api-gateway
  #     dockerfile: Dockerfile
  #   ...

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

networks:
  marketplace-network:
    driver: bridge
